databaseChangeLog:
  - changeSet:
      id: 0004-create-events-table
      author: course-team
      changes:
        - createTable:
            tableName: event
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: max_places
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: occupied_places
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cost
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_event_location
            baseTableName: event
            baseColumnNames: location_id
            referencedTableName: locations
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            constraintName: fk_event_owner
            baseTableName: event
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE